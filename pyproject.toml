[project]
name = "wb-rating-monitor"
version = "0.1.0"
description = "Мониторинг и AI-анализ рейтингов и отзывов Wildberries"
requires-python = ">=3.12,<3.13"
dependencies = [
    # HTTP: Wildberries, Яндекс Мессенджер, LLM — один клиент на всех
    "httpx>=0.28,<1",
    "tenacity>=9.1,<10",      # ретраи на 429 и 5xx
    "aiolimiter>=1.3,<2",     # лимиты WB: 3 запроса/с отзывы, 3/мин аналитика
    # Данные
    "sqlalchemy>=2.0.54,<3",
    "asyncpg>=0.31,<1",
    "redis>=8.1,<9",          # подавление повторов сигналов, кэш
    # Конфигурация и логи
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "loguru>=0.7.3,<1",
    "sentry-sdk[loguru]>=2.20,<3",
    # Расписание
    "apscheduler>=3.11,<4",
    # API
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    # Расчёты и отчёты
    "pandas>=3.0,<4",
    "scipy>=1.18,<2",         # z-тест значимости, FR-3.5
    "scikit-learn>=1.9,<2",   # HDBSCAN — новые причины негатива, FR-5.4
    "sentence-transformers>=5,<6", # локальные многоязычные эмбеддинги MiniLM
    "torch>=2.7,<3",          # CPU wheel для локальной модели без CUDA-зависимостей
    "xlsxwriter>=3.2.9,<4",   # выгрузки с нативными графиками Excel, FR-9
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "respx>=0.23",                    # мок httpx: фикстуры ответов WB без сети
    "testcontainers[postgres]>=4.15",  # интеграционные тесты на реальном Postgres
    "datamodel-code-generator>=0.83",  # генерация pydantic-моделей из OpenAPI WB
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "asyncpg-stubs>=0.30",
    "pandas-stubs",
]
e2e = [
    "pytest-playwright>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "e2e", "performance"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # naive datetime — для нас критично, см. docs/05 § 4.5
    "T20",       # никаких print
    "SIM",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.per-file-ignores]
"app/adapters/wb/models/*" = ["ALL"]  # сгенерировано из OpenAPI, не правим руками
"scripts/run_e2e.py" = ["T201"]  # CLI progress, never application data
"scripts/benchmark_live_collect.py" = ["T201"]  # safe benchmark progress
"performance/*" = ["T201"]  # isolated benchmark progress and machine-readable results

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = "app/adapters/wb/models/"

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "xlsxwriter.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
