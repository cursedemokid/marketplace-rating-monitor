image: python:3.12-slim

services:
  - name: postgres:16-alpine
    alias: postgres

variables:
  POSTGRES_DB: wb_rating_monitor
  POSTGRES_USER: wb
  POSTGRES_PASSWORD: wb
  DATABASE_URL: postgresql+asyncpg://wb:wb@postgres:5432/wb_rating_monitor
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  paths:
    - .uv-cache/

stages:
  - test

test:
  stage: test
  before_script:
    - python -m pip install --disable-pip-version-check uv==0.12.17
    - uv sync --frozen
    - |
      uv run python - <<'PY'
      import asyncio
      import os

      import asyncpg

      from app.migrate import to_asyncpg_dsn

      async def wait_for_postgres():
          for attempt in range(30):
              try:
                  conn = await asyncpg.connect(to_asyncpg_dsn(os.environ["DATABASE_URL"]))
              except (OSError, asyncpg.PostgresError):
                  await asyncio.sleep(2)
              else:
                  await conn.close()
                  return
          raise RuntimeError("PostgreSQL не стала доступна за 60 секунд")

      asyncio.run(wait_for_postgres())
      PY
    - uv run python -m app.migrate
  script:
    - uv run ruff check app tests
    - uv run ruff format --check app tests
    - uv run mypy app
    - uv run pytest -q
